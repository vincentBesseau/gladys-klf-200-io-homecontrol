<svg viewBox="0 0 800 534" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="slat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>

  <rect width="800" height="534" fill="url(#bg)"/>

  <g transform="translate(0,42)">
    <!-- Window group -->
    <g transform="translate(120,75)">
      <rect x="-14" y="-14" width="328" height="328" rx="18" fill="url(#frame)"/>
      <rect x="6" y="6" width="288" height="288" rx="8" fill="url(#sky)"/>

      <!-- shutter slats, partially closed to show a "position" -->
      <g>
        <rect x="6" y="6"  width="288" height="30" fill="url(#slat)" stroke="#1e3a8a" stroke-width="1.5"/>
        <rect x="6" y="40" width="288" height="30" fill="url(#slat)" stroke="#1e3a8a" stroke-width="1.5"/>
        <rect x="6" y="74" width="288" height="30" fill="url(#slat)" stroke="#1e3a8a" stroke-width="1.5"/>
        <rect x="6" y="108" width="288" height="30" fill="url(#slat)" stroke="#1e3a8a" stroke-width="1.5"/>
        <rect x="6" y="142" width="288" height="30" fill="url(#slat)" stroke="#1e3a8a" stroke-width="1.5"/>
      </g>

      <!-- window cross for the visible (open) lower portion -->
      <line x1="150" y1="178" x2="150" y2="294" stroke="#e0f2fe" stroke-width="4"/>
      <line x1="6" y1="236" x2="294" y2="236" stroke="#e0f2fe" stroke-width="4"/>
    </g>

    <!-- wireless signal arcs (io-homecontrol RF) -->
    <g transform="translate(470,150)" stroke="#38bdf8" fill="none" stroke-width="6" stroke-linecap="round">
      <path d="M0,60 A60,60 0 0,1 60,0" opacity="0.9"/>
      <path d="M-25,85 A95,95 0 0,1 85,-25" opacity="0.6"/>
      <path d="M-50,110 A130,130 0 0,1 110,-50" opacity="0.35"/>
      <circle cx="0" cy="60" r="9" fill="#38bdf8" stroke="none"/>
    </g>

    <!-- gateway box -->
    <g transform="translate(560,215)">
      <rect x="0" y="0" width="120" height="80" rx="10" fill="#1e293b" stroke="#475569" stroke-width="2"/>
      <circle cx="20" cy="20" r="5" fill="#38bdf8"/>
      <rect x="16" y="40" width="88" height="8" rx="4" fill="#334155"/>
      <rect x="16" y="56" width="88" height="8" rx="4" fill="#334155"/>
    </g>

    <!-- text -->
    <text x="120" y="380" font-family="Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#f8fafc">KLF200</text>
    <text x="120" y="415" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#38bdf8" letter-spacing="1">io-homecontrol integration for Gladys</text>
  </g>
</svg>
